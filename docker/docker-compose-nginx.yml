# docker compose -p container-simpeg -f docker-compose-nginx.yml

version: '3.3'
services:
    nginx:
        deploy:
            resources:
                limits:
                    cpus: ${SERVER_CPU}
                    memory: ${SERVER_MEMORY}
        container_name: nginx_${SERVER_NAME}
        image: nginx:alpine
        ports:
            - ${SERVER_PORT}:80
        depends_on:
            - app
        volumes:
            - ./../:/var/www/html
            - ./configNginx/nginx/default.conf:/etc/nginx/conf.d/default.conf
        restart: always
        # network_mode: "host"
        networks:
          - network_container

    app:
        container_name: portal_${SERVER_NAME}
        build:
            context: ./configNginx
            dockerfile: Dockerfile
        volumes:
            - ./../:/var/www/html
        working_dir: /var/www/html
        restart: always
        networks:
          - network_container
    php:
        container_name: php_${SERVER_NAME}
        image: php:8.2.36-fpm-alpine
        depends_on:
            - app
        volumes:
            - ./../:/var/www/html
            - ./configNginx/php/php.ini:/usr/local/etc/php/php.ini
        restart: always
        networks:
          - network_container
networks:
  network_container:
    driver: bridge
