services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: ${SERVER_NAME:-app}_image_frankenphp
        container_name: ${SERVER_NAME}_frankenphp
        volumes:
            - ./../:/app
            - ./caddyFIle/Caddyfile:/etc/caddy/Caddyfile
        ports:
            - ${SERVER_PORT}:80
        environment:
            FRANKENPHP_CONFIG: ${FRANKENPHP_CONFIG}
        deploy:
            resources:
                limits:
                    cpus: ${SERVER_CPU}
                    memory: ${SERVER_MEMORY}
