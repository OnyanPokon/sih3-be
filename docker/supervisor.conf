[supervisord]
nodaemon=true

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/caddy.log

[program:laravel]
command=php /app/artisan queue:work
autostart=true
autorestart=true
user=root
redirect_stderr=true
